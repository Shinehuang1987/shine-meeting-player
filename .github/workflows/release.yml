name: Publish BRAT beta
on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - test-mobile.cjs
      - .github/workflows/release.yml
      - scripts/publish-release.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brat-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and mobile behavior
        run: |
          node --check main.js
          node test-mobile.cjs
      - name: Publish versioned BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: node scripts/publish-release.mjs
